spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: hisabkit-backend
    version: 1.2.0
  messages:
    basename: i18n/messages
    encoding: UTF-8
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Server Port (dev & prod both use 8010)
server:
  port: ${SERVER_PORT:8010}

# Security Configurations (Global)
hisabkit:
  jwt:
    # Dev fallback only; set JWT_SECRET in env for all non-local environments.
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-min-32-bytes}
    expiration: 86400000 # 24 hours
  google:
    # Keep empty by default; provide GOOGLE_CLIENT_ID through environment configuration.
    client-id: ${GOOGLE_CLIENT_ID:}
  security:
    # Configure CORS_ALLOWED_ORIGINS per environment (.env, Docker, or host environment).
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  bootstrap:
    enabled: true
    tenant-name: "Platform Auditor"
    tenant-slug: "auditor"
    business-type: "Platform"
    username: "admin"
    password: "password123"
  upload:
    dir: ${UPLOAD_DIR:./uploads}

---
# Development Profile (Universal — Preferred MariaDB via Docker)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Relative to the apps/api folder for absolute portability
    url: ${DEV_JDBC_URL:jdbc:h2:file:./data/hisabkit-db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    driver-class-name: ${DEV_DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:password}
  jpa:
    database-platform: ${DEV_DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

---
# Production Profile (Oracle Cloud — Hestia-managed MariaDB)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # host.docker.internal resolves to the Docker host (where HestiaCP MariaDB runs)
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 600000        # 10 minutes (refresh before MariaDB timeout)
      idle-timeout: 300000         # 5 minutes
      keepalive-time: 60000        # Check every 1 minute
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false
# Logging Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId:-system}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId:-system}] - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
# SpringDoc Configuration
springdoc:
  show-actuator: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    try-it-out-enabled: true
