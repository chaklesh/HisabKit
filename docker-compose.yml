version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: hisabkit-db-dev
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: hisabkit_dev
      MARIADB_USER: devuser
      MARIADB_PASSWORD: devpassword
    ports:
      - "3388:3306" # Mapped to 3388 on host to avoid conflict with local mysql
    volumes:
      - hisabkit-db-data:/var/lib/mysql
    networks:
      - hisabkit-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hisabkit-api
    ports:
      - "8010:8010"
    env_file:
      - apps/api/.env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=hisabkit_dev
      - DB_USER=devuser
      - DB_PASSWORD=devpassword
    depends_on:
      - db
    volumes:
      - ./apps/api/uploads:/app/uploads
    restart: always
    networks:
      - hisabkit-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hisabkit-web
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: always
    networks:
      - hisabkit-network

volumes:
  hisabkit-db-data:
    driver: local

networks:
  hisabkit-network:
    driver: bridge
