version: '3.8'

services:
  app:
    build:
      context: ./hisabkit-backend
    container_name: hisabkit-backend
    ports:
      - "8010:8010"
    env_file:
      - ./hisabkit-backend/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=host.docker.internal  # On Linux, you may need to use your server IP or extra_hosts
    volumes:
      - ./hisabkit-backend/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    networks:
      - hisabkit-network

  frontend:
    build:
      context: ./hisabkit-frontend
    container_name: hisabkit-frontend
    ports:
      - "3010:3010"
    depends_on:
      - app
    restart: always
    networks:
      - hisabkit-network

networks:
  hisabkit-network:
    driver: bridge
