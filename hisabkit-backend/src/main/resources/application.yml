spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: hisabkit-backend
  messages:
    basename: i18n/messages
    encoding: UTF-8
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Server Port (dev & prod both use 8010)
server:
  port: ${SERVER_PORT:8010}

# Security Configurations (Global)
hisabkit:
  jwt:
    secret: ${JWT_SECRET:9QmW2fN8sR4uV7xA1kL5dH3pT6zC0bY8nE2rJ4mP7qS1tU5w}
    expiration: 86400000 # 24 hours
  google:
    client-id: ${GOOGLE_CLIENT_ID:964754530671-a38f6mbkbod3mk99md0upp4onrbib9cs.apps.googleusercontent.com}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3010,https://hisabkit.nayag.com,http://hisabkit.nayag.com,https://hisabkitab.nayag.com,http://hisabkitab.nayag.com}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    tenant-name: ${BOOTSTRAP_ADMIN_TENANT_NAME:}
    tenant-slug: ${BOOTSTRAP_ADMIN_TENANT_SLUG:}
    business-type: ${BOOTSTRAP_ADMIN_BUSINESS_TYPE:System}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  upload:
    dir: ${UPLOAD_DIR:./uploads}

---
# Development Profile (Windows Local — H2 file-based)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:../data/hisabkit-db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: ${DEV_DB_USER:sa}
    password: ${DEV_DB_PASSWORD:password}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  devtools:
    restart:
      enabled: false

---
# Production Profile (Oracle Cloud — Hestia-managed MariaDB)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # host.docker.internal resolves to the Docker host (where HestiaCP MariaDB runs)
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false
