spring:
  profiles:
    active: dev
  application:
    name: hisabkit-backend
  messages:
    basename: i18n/messages
    encoding: UTF-8

---
# Development Profile (Windows Local)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:../data/hisabkit-db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  devtools:
    restart:
      enabled: true

---
# Production Profile (Oracle Cloud)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:hisabkit}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

# Security Configurations
hisabkit:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000 # 24 hours
  upload:
    dir: ${UPLOAD_DIR:./uploads}
